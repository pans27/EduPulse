# Local development stack. DigitalOcean uses infra/swarm/stack.yml.
name: edupulse-pg-preview

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # postgres:18 keeps its data under /var/lib/postgresql/18/docker, so mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./services/api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      EDUPULSE_DATABASE_WRITES: "1"
      EDUPULSE_RESOURCE_NOTIFY_CHANNEL: resource_updates
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: ./services/worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      FAKE_SITE_URL: http://fake-site:8000
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.28-alpine
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8082:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3

  fake-site:
    build: ./services/fake-site
    environment:
      FAKE_ADMIN_TOKEN: ${FAKE_ADMIN_TOKEN}
    ports:
      - "127.0.0.1:8001:8000"

volumes:
  pgdata:
