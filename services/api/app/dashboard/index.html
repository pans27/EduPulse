<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EduPulse Dashboard</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./dashboard.js" defer></script>
</head>
<body>
  <header><div class="shell"><strong>EduPulse</strong><div class="actions"><a href="/docs">API docs</a><button id="sign-out" type="button" hidden>Sign out</button></div></div></header>
  <main class="shell">
    <section id="sign-in-panel" class="panel" aria-labelledby="sign-in-title" hidden>
      <h1 id="sign-in-title">Sign in to EduPulse</h1>
      <form id="sign-in">
        <fieldset>
          <label>Email<input name="email" type="email" autocomplete="username" required maxlength="320"></label>
          <label>Password<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label>
          <button class="primary">Sign in</button>
          <button id="show-register" type="button">Create an account</button>
        </fieldset>
      </form>
      <p id="sign-in-error" role="alert" hidden></p>
    </section>
    <section id="sign-up-panel" class="panel" aria-labelledby="sign-up-title" hidden>
      <h1 id="sign-up-title">Create an account</h1>
      <form id="sign-up">
        <fieldset>
          <label>Email<input name="email" type="email" autocomplete="username" required maxlength="320"></label>
          <label>Password (at least 12 characters)<input name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="256"></label>
          <button class="primary">Register</button>
          <button id="show-login" type="button">Back to sign in</button>
        </fieldset>
      </form>
      <p id="sign-up-error" role="alert" hidden></p>
    </section>
    <div id="dashboard" hidden>
    <div class="heading">
      <div><h1>Course resources</h1><p id="connection" role="status">Connecting…</p></div>
      <label>Course <select id="course" disabled></select></label>
    </div>
    <p id="notice" role="status" hidden></p>
    <section id="admin-panel" class="panel" aria-labelledby="admin-title" hidden>
      <h2 id="admin-title">Administration</h2>
      <form id="create-course">
        <fieldset>
          <legend>Create a course</legend>
          <label>Course ID<input name="id" required maxlength="100" pattern="[A-Za-z0-9][A-Za-z0-9_\-]*"></label>
          <label>Course name<input name="name" required maxlength="120"></label>
          <button class="primary">Create course</button>
        </fieldset>
      </form>
      <form id="assign-role">
        <fieldset>
          <legend>Assign a role</legend>
          <label>User email<input name="email" type="email" required maxlength="320"></label>
          <label>Role<select name="role" id="assignment-role"><option value="staff">Course staff</option><option value="student">Student</option><option value="admin">Administrator</option></select></label>
          <label id="assignment-course">Course ID<input name="course_id" required maxlength="100"></label>
          <button class="primary">Assign role</button>
        </fieldset>
      </form>
    </section>
    <div class="layout">
      <section class="panel" aria-labelledby="resources-title">
        <div class="section-heading"><h2 id="resources-title">Resources</h2><button id="refresh" type="button" disabled>Refresh</button></div>
        <p id="empty">Loading resources…</p>
        <ul id="resources"></ul>
        <p id="metrics" class="muted"></p>
      </section>
      <section id="register-panel" class="panel" aria-labelledby="add-title" hidden>
        <h2 id="add-title">Register a resource</h2>
        <form id="register">
          <fieldset id="register-fields" disabled>
            <label>Name<input name="name" required maxlength="120"></label>
            <label>Resource URL<input name="url" type="url" required placeholder="https://"></label>
            <label>Check interval in seconds<input name="interval" type="number" min="1" value="60" required></label>
            <label>Expected release (optional)<input name="release" type="datetime-local"></label>
            <button class="primary">Register</button>
          </fieldset>
        </form>
      </section>
    </div>
    </div>
  </main>
  <dialog id="report-dialog" aria-labelledby="report-title">
    <form id="report">
      <h2 id="report-title">Report an issue</h2>
      <p id="report-resource"></p>
      <label>Description<textarea name="description" required maxlength="2000" rows="4"></textarea></label>
      <p id="report-error" role="alert" hidden></p>
      <div class="actions"><button type="button" id="cancel">Cancel</button><button type="submit" class="primary">Submit report</button></div>
    </form>
  </dialog>
</body>
</html>
