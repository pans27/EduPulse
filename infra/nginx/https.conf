# Swarm: HTTPS with a Let's Encrypt certificate from certbot on the manager.
# Port 80 only answers challenges and the healthcheck, and redirects everything else.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # certbot --cert-name edupulse keeps this path fixed whatever the hostname is.
    ssl_certificate     /etc/letsencrypt/live/edupulse/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edupulse/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/edupulse.inc;
}
