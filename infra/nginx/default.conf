# Reverse proxy in front of the API replicas, plain HTTP. Used by local Compose, and by the
# Swarm stack only to bootstrap the first certificate (see infra/swarm/README.md).

# WebSocket upgrades send "Connection: upgrade"; ordinary requests keep the default.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Liveness of Nginx itself, for the container healthcheck. /health goes through to the API.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Let's Encrypt HTTP-01 challenges, written by certbot on the manager. Absent locally.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/snippets/edupulse.inc;
}
