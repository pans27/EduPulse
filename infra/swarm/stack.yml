# Swarm stack. Deploy from the manager:
#   REGISTRY=... TAG=... docker stack deploy -c infra/swarm/stack.yml edupulse
# Images are prebuilt (Swarm ignores `build:`); secrets are created once with `docker secret create`.

x-db-client: &db-client
  environment:
    POSTGRES_DB: edupulse
    POSTGRES_USER: edupulse
  secrets:
    - pg_password
  configs:
    - source: db_env
      target: /usr/local/bin/db-env.sh
      mode: 0555
  entrypoint: ["/usr/local/bin/db-env.sh"]
  networks:
    - backend

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: edupulse
      POSTGRES_USER: edupulse
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets:
      - pg_password
    volumes:
      # The DigitalOcean Volume is mounted at /mnt/edupulse_pgdata on the manager. Bind the
      # postgres/ subdirectory, which exists only on the Volume: if the Volume is not mounted,
      # the task fails instead of starting an empty database on the Droplet's own disk.
      - type: bind
        source: ${PGDATA_DIR:-/mnt/edupulse_pgdata/postgres}
        target: /var/lib/postgresql
    networks:
      - backend
    # Postgres stops on SIGINT (fast shutdown); give it time to checkpoint before SIGKILL.
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edupulse -d edupulse"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      replicas: 1
      placement:
        # The Volume is attached to this node only, so Postgres must not move.
        constraints: [node.labels.db == true]
      resources:
        limits: {memory: 512M}

  migrate:
    <<: *db-client
    image: ${REGISTRY:-edupulse}/migrate:${TAG:-dev}
    command: ["alembic", "upgrade", "head"]
    deploy:
      # Runs to completion once per deploy instead of being kept running. Swarm has no depends_on,
      # so it retries while Postgres is still starting; the API answers 503 until the tables exist.
      mode: replicated-job
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
      placement:
        constraints: [node.labels.db == true]

  api:
    <<: *db-client
    image: ${REGISTRY:-edupulse}/api:${TAG:-dev}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment:
      # Merge keys replace the anchor's environment rather than extending it, so repeat the DB names.
      POSTGRES_DB: edupulse
      POSTGRES_USER: edupulse
      # Each replica LISTENs on this channel and pushes resource changes to its WebSocket clients,
      # so a client connected to any replica sees updates written through any other.
      EDUPULSE_RESOURCE_NOTIFY_CHANNEL: resource_updates
    deploy:
      replicas: 3
      placement:
        # Swarm spreads replicas across eligible nodes by default. A hard per-node cap would block
        # start-first updates, which need one spare slot for the new replica.
        constraints: [node.labels.app == true]
      update_config:
        # Replace one replica at a time and start the new one before stopping the old one.
        parallelism: 1
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: start-first
      resources:
        limits: {memory: 192M}

  worker:
    <<: *db-client
    image: ${REGISTRY:-edupulse}/worker:${TAG:-dev}
    command: ["python", "-m", "worker"]
    environment:
      POSTGRES_DB: edupulse
      POSTGRES_USER: edupulse
      FAKE_SITE_URL: http://fake-site:8000
    deploy:
      replicas: 2
      placement:
        constraints: [node.labels.app == true]
      update_config: {parallelism: 1, order: start-first}
      resources:
        limits: {memory: 128M}

  dispatcher:
    <<: *db-client
    image: ${REGISTRY:-edupulse}/worker:${TAG:-dev}
    command: ["python", "-m", "worker.dispatch"]
    environment:
      POSTGRES_DB: edupulse
      POSTGRES_USER: edupulse
      # The mock sink until the DigitalOcean Function exists; then its URL and a token secret.
      MAIL_ENDPOINT: http://mail-sink:8000/send
    deploy:
      # One is enough for the load; leases make a second replica safe if it is ever added.
      replicas: 1
      placement:
        constraints: [node.labels.app == true]
      resources:
        limits: {memory: 96M}

  mail-sink:
    image: ${REGISTRY:-edupulse}/mail-sink:${TAG:-dev}
    networks:
      - backend
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.fakesite == true]
      resources:
        limits: {memory: 96M}

  fake-site:
    image: ${REGISTRY:-edupulse}/fake-site:${TAG:-dev}
    environment:
      FAKE_ADMIN_TOKEN_FILE: /run/secrets/fake_admin_token
    secrets:
      - fake_admin_token
    networks:
      - backend
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.fakesite == true]
      resources:
        limits: {memory: 96M}

  nginx:
    image: nginx:1.28-alpine
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
      - source: nginx_inc
        target: /etc/nginx/snippets/edupulse.inc
    volumes:
      # Certificates and HTTP-01 challenge files, managed by certbot on the manager (see README).
      - {type: bind, source: /etc/letsencrypt, target: /etc/letsencrypt, read_only: true}
      - {type: bind, source: /var/www/certbot, target: /var/www/certbot, read_only: true}
    ports:
      # Host mode binds the ports on the manager itself instead of the routing mesh,
      # so Nginx sees the real client IP and only the manager accepts web traffic.
      - {target: 80, published: 80, protocol: tcp, mode: host}
      - {target: 443, published: 443, protocol: tcp, mode: host}
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      resources:
        limits: {memory: 64M}

networks:
  backend:
    driver: overlay
    # Lets one-off containers (psql, migrations, load tests) join with `docker run --network edupulse_backend`.
    attachable: true


secrets:
  pg_password:
    external: true
  fake_admin_token:
    external: true

configs:
  # Configs are immutable; the name carries a version so an edited file can be rolled out.
  # https.conf by default; NGINX_CONF_FILE=default.conf serves plain HTTP to bootstrap the first certificate.
  nginx_conf:
    name: nginx_${NGINX_CONF_FILE:-https.conf}_${NGINX_CONF_VERSION:-1}
    file: ../nginx/${NGINX_CONF_FILE:-https.conf}
  nginx_inc:
    name: nginx_inc_${NGINX_CONF_VERSION:-1}
    file: ../nginx/edupulse.inc
  db_env:
    name: db_env_${DB_ENV_VERSION:-1}
    file: ./db-env.sh
