#cloud-config
# Paste into "Advanced options > Add initialization scripts (user data)" when creating each Droplet.
# Same file for all three nodes; roles are assigned later with docker swarm init/join.

package_update: true
packages:
  - ca-certificates
  - curl
  - jq

write_files:
  # Cap container logs so a chatty service cannot fill a 25 GB disk.
  - path: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" }
      }
  - path: /etc/sysctl.d/99-swap.conf
    content: |
      vm.swappiness=10

runcmd:
  # 1 GB of swap so a 1 GB node survives image builds and short memory spikes.
  - [sh, -c, "fallocate -l 1G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo '/swapfile none swap sw 0 0' >> /etc/fstab"]
  - [sysctl, -p, /etc/sysctl.d/99-swap.conf]
  # Docker Engine from Docker's official install script (includes the compose plugin).
  - [sh, -c, "curl -fsSL https://get.docker.com | sh"]
  - [systemctl, enable, --now, docker]
  - [sh, -c, "echo done > /var/log/edupulse-bootstrap.done"]
